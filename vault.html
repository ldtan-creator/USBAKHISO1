<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Két sắt 24h – Khóa giá ưu đãi 5% – USBAKHISO1</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="auth-guard.js?v=20261126"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; color: #111; background: #fff; }
a { color: inherit; text-decoration: none; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.vault-banner { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #fff; border-radius: 20px; padding: 32px 36px; margin-top: 20px; display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
.vault-banner h1 { font-size: 28px; margin-bottom: 8px; }
.vault-banner p { color: #cbd5e1; font-size: 14px; max-width: 620px; line-height: 1.6; }
.vault-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 28px; }
.v-card { border: 1.5px solid #f59e0b; background: #fffbeb; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; }
.v-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; background: #fff; margin-bottom: 12px; }
.timer-pill { display: inline-flex; align-items: center; gap: 6px; background: #92400e; color: #fff; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; margin-bottom: 10px; width: fit-content; font-variant-numeric: tabular-nums; }
.btn { border: none; cursor: pointer; padding: 11px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.btn-dark { background: #111; color: #fff; width: 100%; }
.btn-outline { background: #fff; color: #111; border: 1px solid #cbd5e1; width: 100%; }
@media (max-width: 900px) { .vault-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .vault-grid { grid-template-columns: 1fr; } }
</style>
</head><body>
<div id="app-header"></div>
<main class="container">
  <div class="vault-banner">
    <div>
      <span style="background:#f59e0b;color:#111;font-size:11px;font-weight:800;padding:4px 12px;border-radius:999px;display:inline-block;margin-bottom:10px;">ĐẶC QUYỀN GIỮ GIÁ 24 GIỜ</span>
      <h1>🔐 Két sắt 24h – Khóa giá giảm ngay 5%</h1>
      <p>Chưa chốt đơn ngay? Đưa sản phẩm vào <b>Két sắt 24h</b> để đóng băng mức giá ưu đãi <b>giảm trực tiếp 5%</b> trong vòng 24 giờ đồng hồ, bất chấp biến động giá thị trường.</p>
    </div>
    <a href="products.html" class="btn" style="background:#f59e0b;color:#111;">+ Chọn thêm máy vào Két sắt</a>
  </div>

  <div id="vaultList"></div>
</main>
<div id="app-footer"></div>
<script src="catalog-products.js?v=20261126"></script>
<script src="app.js?v=20261126"></script>
<script>
function formatCountdown(ms) {
  if (ms <= 0) return 'Đã hết hạn';
  const totalSec = Math.floor(ms / 1000);
  const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
  const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
  const s = String(totalSec % 60).padStart(2, '0');
  return `${h}:${m}:${s}`;
}

window.PAGE_INIT = function () {
  function renderVault() {
    const entries = USBAK_VAULT.getVault();
    const box = document.getElementById('vaultList');
    if (!entries.length) {
      box.innerHTML = `
        <div style="background:#f8fafc;border:1px dashed #cbd5e1;border-radius:20px;padding:60px 24px;text-align:center;margin-top:28px;">
          <h2 style="font-size:20px;margin-bottom:8px;">Két sắt 24h của bạn đang trống</h2>
          <p style="color:#64748b;font-size:14px;margin-bottom:20px;">Nhấn nút <b>"🔐 Két sắt 24h"</b> trên bất kỳ sản phẩm nào để khóa giá giảm 5% trong 24 giờ.</p>
          <a href="products.html" class="btn" style="background:#111;color:#fff;">Khám phá sản phẩm ngay</a>
        </div>
      `;
      return;
    }

    box.innerHTML = `<div class="vault-grid">` + entries.map(entry => {
      const p = (window.PRODUCTS || []).find(x => x.id === entry.id);
      if (!p) return '';
      const leftMs = entry.expiresAt - Date.now();
      return `
        <div class="v-card">
          <div class="timer-pill">⏳ Hiệu lực còn: <span class="v-countdown" data-exp="${entry.expiresAt}">${formatCountdown(leftMs)}</span></div>
          <img src="${p.img || ''}" alt="${p.name}">
          <h3 style="font-size:15px;font-weight:700;margin-bottom:4px;">${p.name}</h3><div style="font-size:11.5px;color:#92400e;font-weight:600;margin-bottom:6px;">Phiên bản: ${entry.variant || "Tiêu chuẩn"}</div>
          <p style="font-size:12px;color:#64748b;margin-bottom:12px;flex:1;">${p.desc || ''}</p>
          <div style="margin-bottom:14px;">
            <span style="font-size:13px;color:#64748b;text-decoration:line-through;margin-right:8px;">${USBAK_VAULT.fmt(entry.originalPrice)}</span>
            <span style="font-size:18px;font-weight:800;color:#b45309;">${USBAK_VAULT.fmt(entry.lockedPrice)}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button class="btn btn-dark" onclick="addToCart('${p.id}', ${entry.lockedPrice}, '${(entry.variant || '').replace(/'/g, '')}')">Chốt đơn với giá Két sắt (-5%)</button>
            <button class="btn btn-outline" onclick="toggleVault24h('${p.id}');location.reload()">Mở khóa / Xóa khỏi két</button>
          </div>
        </div>
      `;
    }).join('') + `</div>`;
  }

  renderVault();
  setInterval(() => {
    document.querySelectorAll('.v-countdown').forEach(el => {
      const exp = Number(el.getAttribute('data-exp'));
      const left = exp - Date.now();
      if (left <= 0) renderVault();
      else el.textContent = formatCountdown(left);
    });
  }, 1000);
};
</script>
</body></html>
