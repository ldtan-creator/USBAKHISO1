<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>So sánh thông số sản phẩm – USBAKHISO1</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="auth-guard.js?v=20261126"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; color: #111; background: #fff; }
a { color: inherit; text-decoration: none; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.btn { border: none; cursor: pointer; padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.btn-dark { background: #111; color: #fff; }
.btn-outline { background: #fff; color: #111; border: 1px solid #cbd5e1; }
.cmp-header { display: flex; justify-content: space-between; align-items: center; padding: 32px 0 20px; flex-wrap: wrap; gap: 12px; }
.cmp-scroll { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; }
.cmp-table { width: 100%; min-width: 680px; border-collapse: collapse; font-size: 14px; }
.cmp-table th, .cmp-table td { padding: 16px 18px; border-bottom: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; text-align: left; vertical-align: top; }
.cmp-table th { width: 190px; background: #f8fafc; font-weight: 600; color: #334155; }
.cmp-table td:last-child, .cmp-table th:last-child { border-right: none; }
.cmp-img { width: 150px; height: 120px; object-fit: cover; border-radius: 12px; background: #f1f5f9; margin-bottom: 12px; }
.best-price { color: #15803d; font-weight: 700; font-size: 17px; }
.norm-price { color: #0f172a; font-weight: 700; font-size: 16px; }
.diff-highlight { background: #fefce8; }
</style>
</head><body>
<div id="app-header"></div>
<main class="container">
  <div class="cmp-header">
    <div>
      <h1 style="font-size:28px;">⇄ Bảng đối chiếu & So sánh sản phẩm</h1>
      <p style="font-size:13px;color:#64748b;margin-top:4px;">So sánh trực quan cấu hình, giá bán & ưu đãi Két sắt 24h tối đa 3 sản phẩm.</p>
    </div>
    <div style="display:flex;gap:10px;">
      <a href="products.html" class="btn btn-outline">+ Chọn thêm sản phẩm</a>
      <button class="btn btn-outline" onclick="clearCompare()">Xóa tất cả</button>
    </div>
  </div>
  <div id="compareBox"></div>
</main>
<div id="app-footer"></div>
<script src="catalog-products.js?v=20261126"></script>
<script src="app.js?v=20261126"></script>
<script>
window.PAGE_INIT = function () {
  const ids = USBAK_COMPARE.getCompare();
  const items = (window.PRODUCTS || []).filter(p => ids.includes(p.id)).map(p => ({ ...p, _v: USBAK_VARIANTS.resolveVariantDetails(p) }));
  const box = document.getElementById('compareBox');

  if (!items.length) {
    box.innerHTML = `
      <div style="background:#f8fafc;border:1px dashed #cbd5e1;border-radius:20px;padding:60px 24px;text-align:center;">
        <h2 style="font-size:20px;margin-bottom:8px;">Danh sách so sánh đang trống</h2>
        <p style="color:#64748b;font-size:14px;margin-bottom:20px;">Bấm nút <b>"⇄ So sánh"</b> trên tối đa 3 sản phẩm bất kỳ để đặt lên bàn cân thông số.</p>
        <a href="products.html" class="btn btn-dark">Khám phá 107 sản phẩm</a>
      </div>
    `;
    return;
  }

  const minPrice = Math.min(...items.map(i => i._v.finalPrice));
  const catNames = { 'dien-thoai': 'Điện thoại', 'laptop': 'Laptop', 'tablet': 'Máy tính bảng', 'tai-nghe': 'Tai nghe', 'phu-kien': 'Phụ kiện' };

  box.innerHTML = `
    <div class="cmp-scroll">
      <table class="cmp-table">
        <tr>
          <th>Sản phẩm</th>
          ${items.map(p => `
            <td>
              <img class="cmp-img" src="${p.img || ''}" alt="${p.name}">
              <div style="font-weight:700;font-size:15px;line-height:1.4;">${p.name}</div>
            </td>
          `).join('')}
        </tr>
        <tr>
          <th>Giá bán niêm yết</th>
          ${items.map(p => `
            <td class="${items.length > 1 && p._v.finalPrice === minPrice ? 'diff-highlight' : ''}">
              <span class="${p._v.finalPrice === minPrice ? 'best-price' : 'norm-price'}">${USBAK_CART.fmt(p._v.finalPrice)}</span>
              ${items.length > 1 && p._v.finalPrice === minPrice ? '<div style="font-size:11px;color:#15803d;font-weight:600;margin-top:2px;">★ Giá tốt nhất trong nhóm</div>' : ''}
            </td>
          `).join('')}
        </tr>
        <tr>
          <th>Giá Két sắt 24h (-5%)</th>
          ${items.map(p => {
            const vp = Math.round(p._v.finalPrice * 0.95 / 10000) * 10000;
            return `<td><b style="color:#b45309;">${USBAK_CART.fmt(vp)}</b></td>`;
          }).join('')}
        </tr>
        <tr>
          <th>Phiên bản đang chọn</th>
          ${items.map(p => `<td><b style="color:#0284c7;">${p._v.variantText}</b></td>`).join('')}
        </tr>
        <tr>
          <th>Thương hiệu</th>
          ${items.map(p => `<td>${p.brand || '-'}</td>`).join('')}
        </tr>
        <tr>
          <th>Danh mục</th>
          ${items.map(p => `<td>${catNames[p.cat] || p.cat}</td>`).join('')}
        </tr>
        <tr>
          <th>Mã SKU</th>
          ${items.map(p => `<td><code style="background:#f1f5f9;padding:3px 8px;border-radius:6px;">${p.sku || p.id.toUpperCase()}</code></td>`).join('')}
        </tr>
        <tr>
          <th>Cấu hình & Thông số</th>
          ${items.map(p => `<td style="line-height:1.6;color:#334155;">${p.desc || '-'}</td>`).join('')}
        </tr>
        <tr>
          <th>Hành động</th>
          ${items.map(p => `
            <td>
              <div style="display:flex;flex-direction:column;gap:8px;max-width:200px;">
                <button class="btn btn-dark" onclick="addToCart('${p.id}')">+ Thêm vào giỏ</button>
                <button class="btn btn-outline" onclick="toggleVault24h('${p.id}')">🔐 Khóa giá Két sắt 24h</button>
                <button class="btn btn-outline" style="color:#dc2626;" onclick="toggleCompare('${p.id}');location.reload()">Bỏ khỏi so sánh</button>
              </div>
            </td>
          `).join('')}
        </tr>
      </table>
    </div>
  `;
};
</script>
</body></html>
