<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Danh sách sản phẩm – USBAKHISO1</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="auth-guard.js?v=20261126"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; color: #111; background: #fff; }
a { color: inherit; text-decoration: none; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.header { background: #fff; border-bottom: 1px solid #e2e2e2; position: sticky; top: 0; z-index: 50; }
.header .container { display: flex; align-items: center; gap: 28px; height: 76px; }
.logo { font-weight: 800; font-size: 20px; letter-spacing: 1px; }
.nav { display: flex; gap: 24px; font-size: 14px; font-weight: 500; }
.search { flex: 1; max-width: 400px; background: #f0f0f0; border-radius: 12px; padding: 0 14px; height: 42px; display: flex; align-items: center; }
.search input { width: 100%; border: none; background: transparent; outline: none; font-size: 14px; }
.btn { border: none; cursor: pointer; padding: 10px 20px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.btn-dark { background: #111; color: #fff; }
.btn-outline { background: #fff; color: #111; border: 1px solid #bbb; width: 100%; }
.btn-outline:hover { background: #111; color: #fff; border-color: #111; }
.shop { display: grid; grid-template-columns: 250px 1fr; gap: 32px; padding: 32px 0 64px; align-items: start; }
.filters { background: #f4f4f5; border-radius: 16px; padding: 22px; position: sticky; top: 96px; }
.filters h4 { font-size: 14px; margin-bottom: 10px; margin-top: 16px; }
.filters h4:first-child { margin-top: 0; }
.filter-opt { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 0; cursor: pointer; }
.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px; }
.toolbar select { padding: 8px 12px; border-radius: 10px; border: 1px solid #ccc; }
.product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
.product-card { border: 1px solid #ececec; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; transition: .2s; }
.product-card:hover { box-shadow: 0 10px 24px rgba(0,0,0,.06); }
.thumb { background: #f6f6f6; border-radius: 12px; aspect-ratio: 1/.85; overflow: hidden; margin-bottom: 12px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.badge { display: inline-block; font-size: 11px; background: #f0f0f0; padding: 3px 10px; border-radius: 999px; margin-bottom: 8px; width: fit-content; }
.product-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.desc { font-size: 12px; color: #666; margin-bottom: 10px; flex: 1; }
.price { font-size: 16px; font-weight: 700; color: #0369a1; margin-bottom: 12px; }
@media (max-width: 900px) { .shop { grid-template-columns: 1fr; } .filters { position: static; } .product-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 540px) { .product-grid { grid-template-columns: 1fr; } }
</style>
</head><body>
<div id="app-header" data-page-name="products"></div>
<main class="container">
  <div class="shop">
    <aside class="filters">
      <h4>Danh mục sản phẩm</h4>
      <label class="filter-opt"><input type="radio" name="cat" value="all" checked> Tất cả (107)</label>
      <label class="filter-opt"><input type="radio" name="cat" value="dien-thoai"> Điện thoại</label>
      <label class="filter-opt"><input type="radio" name="cat" value="laptop"> Laptop & MacBook</label>
      <label class="filter-opt"><input type="radio" name="cat" value="tablet"> Máy tính bảng</label>
      <label class="filter-opt"><input type="radio" name="cat" value="tai-nghe"> Tai nghe</label>
      <label class="filter-opt"><input type="radio" name="cat" value="phu-kien"> Phụ kiện chính hãng</label>

      <h4>Thương hiệu</h4>
      <label class="filter-opt"><input type="radio" name="brand" value="all" checked> Tất cả hãng</label>
      <label class="filter-opt"><input type="radio" name="brand" value="Apple"> Apple</label>
      <label class="filter-opt"><input type="radio" name="brand" value="Samsung"> Samsung</label>
      <label class="filter-opt"><input type="radio" name="brand" value="Xiaomi"> Xiaomi</label>
      <label class="filter-opt"><input type="radio" name="brand" value="Redmi"> Redmi</label>
      <label class="filter-opt"><input type="radio" name="brand" value="ASUS"> ASUS</label>
      <label class="filter-opt"><input type="radio" name="brand" value="Dell"> Dell</label>
    </aside>

    <div>
      <div class="toolbar">
        <span id="countLabel">Đang tải danh sách sản phẩm...</span>
        <select id="sortSelect">
          <option value="default">Sắp xếp: Mặc định</option>
          <option value="asc">Giá: Thấp đến Cao</option>
          <option value="desc">Giá: Cao đến Thấp</option>
        </select>
      </div>
      <div class="product-grid" id="grid"></div>
    </div>
  </div>
</main>
<div id="app-footer"></div>
<script src="catalog-products.js?v=20261126"></script>
<script src="app.js?v=20261126"></script>
<script>
window.PAGE_INIT = function () {
  var params = new URLSearchParams(window.location.search);
  var initCat = params.get('cat') || 'all';
  var initQ = (params.get('q') || '').toLowerCase();
  var radioCat = document.querySelector('input[name="cat"][value="' + initCat + '"]');
  if (radioCat) radioCat.checked = true;

  function render() {
    var cat = document.querySelector('input[name="cat"]:checked').value;
    var brand = document.querySelector('input[name="brand"]:checked').value;
    var sort = document.getElementById('sortSelect').value;
    var searchInp = document.getElementById('globalSearch');
    var q = searchInp ? searchInp.value.trim().toLowerCase() : initQ;

    var list = (window.PRODUCTS || []).filter(function (p) {
      if (cat !== 'all' && p.cat !== cat) return false;
      if (brand !== 'all' && !(p.brand || '').toLowerCase().includes(brand.toLowerCase())) return false;
      if (q && !(p.name.toLowerCase().includes(q) || (p.desc || '').toLowerCase().includes(q) || (p.sku || '').toLowerCase().includes(q))) return false;
      return true;
    });

    if (sort === 'asc') list.sort(function (a, b) { return a.price - b.price; });
    if (sort === 'desc') list.sort(function (a, b) { return b.price - a.price; });

    document.getElementById('countLabel').textContent = 'Hiển thị ' + list.length + ' sản phẩm';
    document.getElementById('grid').innerHTML = list.map(function (p) {
      return cardHTML(p, true);
    }).join('') || '<p>Không tìm thấy sản phẩm phù hợp.</p>';
  }

  document.querySelectorAll('input[name="cat"], input[name="brand"]').forEach(function (el) {
    el.addEventListener('change', render);
  });
  document.getElementById('sortSelect').addEventListener('change', render);
  var sInp = document.getElementById('globalSearch');
  if (sInp) {
    if (initQ) sInp.value = initQ;
    sInp.addEventListener('input', render);
  }
  render();
};
</script>
</body></html>
